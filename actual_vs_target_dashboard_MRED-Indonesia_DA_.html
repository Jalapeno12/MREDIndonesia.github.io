<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Actual vs Target Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow-x:hidden}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.kpi{border-radius:14px;padding:18px;color:#fff;cursor:pointer;transition:.25s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 10px 20px rgba(0,0,0,.18)}
.kpi.active{outline:4px solid #111827}
</style>
</head>
<body class="m-0 p-0">
<div class="w-full min-h-screen p-6 space-y-6">

<h1 class="text-3xl font-bold text-center">Actual vs Target Performance Dashboard</h1>

<div class="card text-center">
<input id="upload" type="file" accept=".xlsx,.xls" class="hidden">
<button onclick="document.getElementById('upload').click()"
class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg">
Upload Excel
</button>
<p id="fileName" class="mt-2 text-gray-500"></p>
</div>

<div class="grid md:grid-cols-3 gap-4">
<div id="cardGreen" onclick="setFilter('GREEN')" class="kpi bg-green-600"><div>Achieved</div><div id="kpiGreen" class="text-4xl font-bold">0</div></div>
<div id="cardYellow" onclick="setFilter('YELLOW')" class="kpi bg-yellow-500"><div>Near Target</div><div id="kpiYellow" class="text-4xl font-bold">0</div></div>
<div id="cardRed" onclick="setFilter('RED')" class="kpi bg-red-600"><div>Need Action</div><div id="kpiRed" class="text-4xl font-bold">0</div></div>
</div>

<div class="grid md:grid-cols-3 gap-4">
<select id="year" class="border rounded-lg p-2">
<option>Y1</option><option>Y2</option><option>Y3</option>
</select>
<select id="activity" class="border rounded-lg p-2">
<option value="ALL">All Activities</option>
</select>
<input id="search" class="border rounded-lg p-2" placeholder="Search indicator...">
</div>

<div class="card">
<div class="flex justify-between mb-3">
<h2 class="font-bold text-xl">Performance by Indicator</h2>
<button id="sortBtn" class="bg-slate-100 px-3 py-1 rounded">Sort: Lowest First</button>
</div>
<div class="w-full" style="height:calc(100vh - 260px)">
<canvas id="chart"></canvas>
</div>
</div>

<div class="grid md:grid-cols-2 gap-6">
<div class="card">
<h2 class="font-bold text-xl mb-3">Narrative Conclusion</h2>
<div id="narrative"></div>
</div>
<div class="card">
<h2 class="font-bold text-xl text-red-600 mb-3">Priority Actions</h2>
<div id="priority"></div>
</div>
</div>

</div>

<script>
let fullData=[],chart,ascending=true,performanceFilter='ALL',selectedIndicator=null;

upload.onchange=e=>{
 const f=e.target.files[0];
 if(!f)return;
 fileName.textContent=f.name;
 const reader=new FileReader();
 reader.onload=()=>{
  const wb=XLSX.read(reader.result,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  fullData=XLSX.utils.sheet_to_json(sheet);
  loadActivities();
  render();
 };
 reader.readAsArrayBuffer(f);
}

year.onchange=render;
activity.onchange=render;
search.oninput=render;
sortBtn.onclick=()=>{ascending=!ascending;sortBtn.innerText=ascending?"Sort: Lowest First":"Sort: Highest First";render();}


function setFilter(f){
 performanceFilter=(performanceFilter===f && f!=='ALL')?'ALL':f;
 document.querySelectorAll('.kpi').forEach(x=>x.classList.remove('active'));
 if(performanceFilter==='GREEN') cardGreen.classList.add('active');
 else if(performanceFilter==='YELLOW') cardYellow.classList.add('active');
 else if(performanceFilter==='RED') cardRed.classList.add('active');
 render();
}

function loadActivities(){
 const acts=[...new Set(fullData.map(x=>x.Activity))];
 activity.innerHTML='<option value="ALL">All Activities</option>';
 acts.forEach(a=>{
   let o=document.createElement("option");
   o.value=o.text=a;
   activity.add(o);
 });
}

function render(){
 const y=year.value;
 let map={};
 fullData.forEach(r=>{
   if(activity.value!="ALL" && r.Activity!==activity.value)return;
   if(search.value && !r.Activity.toLowerCase().includes(search.value.toLowerCase()))return;
   let v=parseFloat(r[y]);
   if(isNaN(v))return;
   map[r.Activity]??={A:0,T:0};
   if(r.Type==="Actual")map[r.Activity].A=v;
   else map[r.Activity].T=v;
 });

 let rows=[];
 let g=0,ye=0,re=0,sum=0;
 Object.entries(map).forEach(([a,v])=>{
   if(v.T<=0)return;
   let p=v.A/v.T*100;
   if(performanceFilter==='GREEN' && p<100) return;
   if(performanceFilter==='YELLOW' && (p<80 || p>=100)) return;
   if(performanceFilter==='RED' && p>=80) return;
   rows.push({a,...v,p});
   sum+=p;
   if(p>=100)g++; else if(p>=80)ye++; else re++;
 });

 rows.sort((a,b)=>ascending?a.p-b.p:b.p-a.p);

 kpiGreen.innerText=g;
 kpiYellow.innerText=ye;
 kpiRed.innerText=re;

 chart?.destroy();
 chart=new Chart(document.getElementById("chart"),{
   type:"bar",
   data:{
      labels:rows.map(r=>r.a.split(":")[0]),
      datasets:[{
         data:rows.map(r=>r.p),
         borderRadius:8,
         backgroundColor:rows.map(r=>r.p>=100?"#22c55e":r.p>=80?"#facc15":"#ef4444")
      }]
   },
   options:{
      maintainAspectRatio:false,
      indexAxis:'y',
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            title:c=>rows[c[0].dataIndex].a,
            label:c=>{
              const r=rows[c.dataIndex];
              return [`Achievement: ${r.p.toFixed(1)}%`,`Target: ${r.T}`,`Actual: ${r.A}`];
            }
          }
        },
        datalabels:{
          anchor:'end',
          align:'right',
          formatter:v=>v.toFixed(0)+'%'
        }
      },
      scales:{x:{beginAtZero:true,title:{display:true,text:'Achievement (%)'}}},
      onClick:(evt,elements)=>{
          if(!elements.length) return;
          const idx=elements[0].index;
          const item=rows[idx];

          if(selectedIndicator===item.a){
              selectedIndicator=null;
          }else{
              selectedIndicator=item.a;
          }

          activity.value=selectedIndicator ?? 'ALL';
          render();
      }
   },
   plugins:[ChartDataLabels]
 });

 narrative.innerHTML=`<p><b>${g}</b> indicators achieved or exceeded the target, <b>${ye}</b> are near target, and <b>${re}</b> require corrective action. Average achievement is <b>${(rows.length?sum/rows.length:0).toFixed(1)}%</b>.</p>`;

 let red=rows.filter(r=>r.p<80);
 priority.innerHTML=red.length?red.map((r,i)=>`<div class="border-l-4 border-red-600 bg-red-50 p-3 mb-2"><b>${i+1}. ${r.a}</b><span class="float-right text-red-600">${r.p.toFixed(0)}%</span></div>`).join(""):"<i>No red indicators.</i>";
}
</script>
</body>
</html>
